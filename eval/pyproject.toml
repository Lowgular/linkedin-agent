[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-eval"
version = "0.1.0"
description = "Harbor harnesses that run the linkedin-agent folder, and the runner the eval image starts"
requires-python = ">=3.12"
dependencies = ["harbor==0.25.0"]

[project.scripts]
run = "linkedin_eval.run:cli"
results = "linkedin_eval.results:main"
trace = "linkedin_eval.trace:main"
ship = "linkedin_eval.ship:main"

[tool.setuptools]
packages = ["linkedin_eval"]
