[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-eval"
version = "0.1.0"
description = "Harbor harnesses that run the linkedin-agent folder, and the runner the eval image starts"
requires-python = ">=3.12"
dependencies = ["harbor==0.25.0"]

[tool.setuptools]
packages = ["linkedin_eval"]
