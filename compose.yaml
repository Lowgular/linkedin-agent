# compose.yaml — the agent and its browser, for any machine with Docker: nothing installed on the host.
#
#   cp .env.example .env              then put your Gemini API key in it
#   docker compose run --rm agent     Gemini CLI in this folder, the browser started first; ask it about your profile
#   docker compose up -d dev-browser  the browser alone: CDP at localhost:9224, for chrome://inspect or a CLI on
#                                     this machine with browser-mcp started there (browser-mcp/README.md)
#   docker compose down               stop everything
#
# The world is not here: it is a static site (world/, published by world/deploy.sh), and the browser's fake
# proxies LinkedIn's names to it. The agent container shares the browser's network: its entrypoint starts
# browser-mcp on 127.0.0.1:9333, as the folder's .gemini/settings.json says, attached to the browser's CDP on
# 127.0.0.1:9222. Sessions and the CLI's own state persist in the gemini-home volume; the folder itself is
# yours, bind-mounted, so what you change in the brief or the wiki is what the next run reads.
# The project's name is fixed, so the volumes keep their names whatever the clone's folder is called.
name: linkedin-agent
services:
  dev-browser:
    # The browser, built here from dev-browser/: a headless Chromium with its CDP on 9222, resolving LinkedIn's
    # names to a proxy that fetches every page from the world's site (WORLD_URL). No browser tools here: the
    # agent brings its own (browser-mcp/) and attaches over CDP. The tag is the one the dataset's tasks are FROM.
    build: ./dev-browser
    image: ghcr.io/lowgular/dev-browser:0.3.0
    pull_policy: build
    environment:
      WORLD_URL: ${WORLD_URL:-https://linkedin-stub.web.app}
    ports:
      - "127.0.0.1:9224:9222"   # CDP: chrome://inspect (Configure... localhost:9224), or a browser-mcp on this machine
      - "127.0.0.1:4443:4443"   # the world: https://localhost:4443/__world/ lists it (accept the certificate)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9222/json/version"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s
  agent:
    build: .
    image: ghcr.io/lowgular/linkedin-agent:0.1.0
    network_mode: "service:dev-browser"
    depends_on:
      dev-browser:
        condition: service_healthy
      collector:                # with the trace profile only: started with the agent, so its traces have somewhere to go
        condition: service_started
        required: false
    env_file:
      - path: .env
        required: false
    environment:
      # browser-mcp, started by the image's entrypoint, attaches to the browser's CDP: dev-browser's by default
      # — the agent shares its network, so that is loopback, since Chromium accepts CDP only by IP or localhost,
      # not by a name — or a session in Steel's cloud (BROWSER_CDP=steel and STEEL_API_KEY in .env). Either way
      # LinkedIn's address is answered from the world's site in the browser's connection, so any browser sees
      # the world; browser-mcp itself knows nothing of it.
      BROWSER_MCP_CDP: ${BROWSER_CDP:-http://127.0.0.1:9222}
      BROWSER_MCP_MAP_HOSTS: www.linkedin.com=${WORLD_URL:-https://linkedin-stub.web.app}
      # Tracing to Google Cloud, on when .env names a project (and COMPOSE_PROFILES=trace starts the collector):
      # the CLI sends its telemetry over OTLP to the collector service, which ships every model request and
      # tool call as a span to Cloud Trace, the events to Cloud Logging, token counts to Cloud Monitoring.
      # Without a project in .env the CLI emits nothing.
      GEMINI_TELEMETRY_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TRACES_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TARGET: gcp
      GEMINI_TELEMETRY_USE_COLLECTOR: "true"
      GEMINI_TELEMETRY_OTLP_ENDPOINT: http://127.0.0.1:4317
      GEMINI_TELEMETRY_OTLP_PROTOCOL: grpc
      GEMINI_TELEMETRY_LOG_PROMPTS: ${GEMINI_TELEMETRY_LOG_PROMPTS:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - .:/app
      - gemini-home:/root/.gemini
    working_dir: /app
    stdin_open: true
    tty: true
  collector:
    # Only with the `trace` profile (COMPOSE_PROFILES=trace in .env): ships the agent's telemetry to the
    # project GOOGLE_CLOUD_PROJECT names, with the Application Default Credentials from gcloud's folder on
    # this machine (`gcloud auth application-default login`), mounted read-only.
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["trace"]
    network_mode: "service:dev-browser"
    depends_on:
      - dev-browser
    command: ["--config=/etc/otelcol/collector.yaml"]
    user: "0:0"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./telemetry/collector.yaml:/etc/otelcol/collector.yaml:ro
      - ${GCLOUD_CONFIG_DIR:-$HOME/.config/gcloud}:/gcloud:ro
  eval:
    # The agent scored on lowgular/linkedin-po by Harbor: `docker compose run --rm eval -i profile-followers`
    # (eval/linkedin_eval/run.py says the options). Harbor starts each task's container on this machine's
    # Docker, through the socket; the jobs volume is mounted where Docker itself keeps it, so the trials'
    # log folders resolve to the same place for Harbor here and for Docker. Keys come from .env: GEMINI_API_KEY
    # for the agent, ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN for the grader's extractor.
    build: ./eval
    image: ghcr.io/lowgular/linkedin-eval:0.1.0
    profiles: ["eval"]
    env_file:
      - path: .env
        required: false
    environment:
      # A build of dataset/ (dataset/build.sh) runs instead of the Hub's, when there is one; -v runs the Hub's.
      DATASET_DIR: /app/dataset/dist
    volumes:
      - .:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - jobs:/var/lib/docker/volumes/linkedin-agent-jobs/_data
      - harbor-cache:/root/.cache
  eval-results:
    # The latest runs and their scores: `docker compose run --rm eval-results` (a number for more than three).
    image: ghcr.io/lowgular/linkedin-eval:0.1.0
    profiles: ["eval"]
    entrypoint: ["python", "-m", "linkedin_eval.results"]
    volumes:
      - jobs:/var/lib/docker/volumes/linkedin-agent-jobs/_data:ro
volumes:
  gemini-home:
  jobs:
    name: linkedin-agent-jobs
  harbor-cache:
