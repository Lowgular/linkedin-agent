# compose.yaml — the agent and its browser, for any machine with Docker: nothing installed on the host.
#
#   cp .env.example .env              then put your Gemini API key in it
#   docker compose up -d                    everything: the browser (its screen at http://localhost:3023), its tools,
#                                           the agent, the eval, the telemetry
#   docker compose exec agent agy           Antigravity CLI in agent/; ask it about your profile
#   docker compose exec eval run            score the agent on one task of the dataset
#   docker compose exec telemetry trace     the latest traces; with an id, one of them step by step
#   docker compose down                     stop everything
#
# The world is not here: it is a static site (world/, published by world/deploy.sh), and the browser's fake
# proxies LinkedIn's names to it. The browser tools (mcp/browser-mcp) and the agent share the browser's network:
# browser-mcp serves 127.0.0.1:9333, as agent/.agents/mcp_config.json says, attached to the browser's CDP on
# 127.0.0.1:9222, and restarts on every edit to mcp/browser-mcp. Sessions and the CLI's own state persist in the
# agy-home volume; the folder itself is
# yours, bind-mounted, so what you change in the brief or the wiki is what the next run reads.
# The project's name is fixed, so the volumes keep their names whatever the clone's folder is called.
name: linkedin-agent
services:
  browser:
    # The browser: linuxserver.io's Chromium (github.com/linuxserver/docker-chromium), a real, headed Chromium on a
    # desktop streamed to http://localhost:3023, where you watch the agent click; its CDP on 9222, on the
    # container's loopback, for browser-mcp, which shares its network (as do the agent and the collector), so the
    # ports of all of them are published here. Nothing of the world in it: browser-mcp maps LinkedIn's address to
    # the world's site in the browser's connection.
    # Its profile — cookies, sign-ins, history — is the container's /config, a volume named after BROWSER_PROFILE
    # (default: default), so it outlives the container and another name is another profile.
    image: lscr.io/linuxserver/chromium@sha256:59d1bfa98a6ab759fce078e5a714de3920f4c618b8939a0df6e1dec7d25c7aba
    shm_size: 1gb
    configs:
      - source: browser-autostart
        target: /config/.config/labwc/autostart
        mode: 0755
    volumes:
      - browser-profile:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      CHROME_CLI: --remote-debugging-port=9222 --remote-allow-origins=*
    ports:
      - "127.0.0.1:3023:3000"   # the browser's desktop: http://localhost:3023
      - "127.0.0.1:19333:9333"   # host MCP endpoint; container clients still use 9333
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9222/json/version"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
  browser-mcp:
    # The browser tools, served on their own from mcp/browser-mcp, mounted: an edit restarts the server (node
    # --watch), and the next tool call reaches the new code; the sessions and tabs survive in its .runtime/.
    # It attaches to the browser's CDP — the browser service's by default, on loopback since the network is shared and
    # Chromium accepts CDP only by IP or localhost, or a session in Steel's cloud (BROWSER_CDP=https://api.steel.dev/v1/sessions and
    # STEEL_API_KEY in .env) — and answers LinkedIn's address from the world's site in the browser's
    # connection, so any browser sees the world; browser-mcp itself knows nothing of it.
    build: ./mcp/browser-mcp
    image: ghcr.io/lowgular/browser-mcp:0.1.0
    network_mode: "service:browser"
    depends_on:
      browser:
        condition: service_healthy
    command: ["node", "--watch", "server.mjs"]
    environment:
      BROWSER_MCP_HOST: 0.0.0.0   # reachable through the published port too; the Host check still admits only localhost
      # Which browser, explicitly: BROWSER_CDP in .env, or this compose file's own browser service — on the
      # shared loopback — when .env says nothing. curl localhost:9333/health says which one it is on.
      BROWSER_MCP_CDP: ${BROWSER_CDP:-http://127.0.0.1:9222}
      # LinkedIn's address answered from the world's site; WORLD_MAP= (empty) maps nothing: the real LinkedIn.
      BROWSER_MCP_MAP_HOSTS: ${WORLD_MAP-www.linkedin.com=${WORLD_URL:-https://linkedin-stub.web.app}}
      STEEL_API_KEY: ${STEEL_API_KEY:-}
      BROWSER_MCP_PROFILE: ${BROWSER_PROFILE:-}
      STEEL_SESSION_TIMEOUT: ${STEEL_SESSION_TIMEOUT:-900000}
    volumes:
      - ./mcp/browser-mcp:/opt/browser-mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9333/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  agent:
    # Antigravity CLI (agy), logged in with GEMINI_API_KEY from .env; its settings are agent/.agents/settings.json,
    # which the image's entrypoint copies into the CLI's home on every start. The container's own process is the
    # CLI, waiting on its terminal: `docker compose attach agent` is that session, and when /quit ends it the
    # container starts again with a new one.
    restart: unless-stopped
    build: ./agent
    image: ghcr.io/lowgular/linkedin-agent:0.2.0
    network_mode: "service:browser"
    depends_on:
      browser-mcp:
        condition: service_healthy
    environment:
      # The CLI's login, and the only key of .env the agent gets: settings.json says modelProvider gemini, which
      # reads the key from this variable and nowhere else.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./agent:/app
      - agy-home:/root/.gemini
    working_dir: /app
    stdin_open: true
    tty: true
  agent-gemini-cli:
    # DEPRECATED, only with the `gemini-cli` profile: the agent on Gemini CLI, which Google retired for individual
    # accounts; it still runs on a paid API key. Kept for its telemetry, which Antigravity CLI does not export:
    # docker compose --profile gemini-cli run --rm agent-gemini-cli
    build:
      context: ./agent
      dockerfile: Dockerfile.gemini-cli
    image: ghcr.io/lowgular/linkedin-agent:0.1.0
    profiles: ["gemini-cli"]
    network_mode: "service:browser"
    depends_on:
      browser-mcp:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Tracing to Google Cloud, on when .env names a project (and COMPOSE_PROFILES=trace starts the collector):
      # the CLI sends its telemetry over OTLP to the collector service, which ships every model request and
      # tool call as a span to Cloud Trace, the events to Cloud Logging, token counts to Cloud Monitoring.
      # Without a project in .env the CLI emits nothing.
      GEMINI_TELEMETRY_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TRACES_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TARGET: gcp
      GEMINI_TELEMETRY_USE_COLLECTOR: "true"
      GEMINI_TELEMETRY_OTLP_ENDPOINT: http://127.0.0.1:4317
      GEMINI_TELEMETRY_OTLP_PROTOCOL: grpc
      GEMINI_TELEMETRY_LOG_PROMPTS: ${GEMINI_TELEMETRY_LOG_PROMPTS:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ./agent:/app
      - gemini-home:/root/.gemini
    working_dir: /app
    stdin_open: true
    tty: true
  collector:
    # Only with the `trace` profile (COMPOSE_PROFILES=trace in .env): ships the telemetry of agent-gemini-cli (the
    # deprecated Gemini CLI; Antigravity CLI exports none) to the
    # project GOOGLE_CLOUD_PROJECT names, with the Application Default Credentials from gcloud's folder on
    # this machine (`gcloud auth application-default login`), mounted read-only.
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["trace"]
    network_mode: "service:browser"
    depends_on:
      - browser
    command: ["--config=/etc/otelcol/collector.yaml"]
    user: "0:0"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./telemetry/collector.yaml:/etc/otelcol/collector.yaml:ro
      - ${GCLOUD_CONFIG_DIR:-$HOME/.config/gcloud}:/gcloud:ro
  eval:
    # The agent scored on lowgular/browser-use-linkedin by Harbor. The container stays up and its commands are
    # exec'd: `docker compose exec eval run` scores one task (eval/linkedin_eval/run.py says the options),
    # `docker compose exec eval results` lists the latest runs. Harbor starts each task's container on this
    # machine's Docker, through the socket; the jobs volume is mounted where Docker itself keeps it, so the trials'
    # log folders resolve to the same place for Harbor here and for Docker. Keys come from .env: GEMINI_API_KEY
    # for the agent, ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN for the grader's extractor.
    build: ./eval
    image: ghcr.io/lowgular/linkedin-eval:0.2.0
    env_file:
      - .env
    environment:
      # A build of dataset/ (dataset/build.sh) runs instead of the Hub's, when there is one; -v runs the Hub's.
      DATASET_DIR: /app/dataset/dist
      AGENT_DIR: ${AGENT_DIR:-/app/agent}   # another agent folder: AGENT_DIR=/app/agent-plain in .env
    volumes:
      - .:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - jobs:/var/lib/docker/volumes/linkedin-agent-jobs/_data
      - harbor-cache:/root/.cache
      # Codex's own login, for `-h codex` on a ChatGPT plan instead of an API key: the folder `codex login` keeps,
      # read-only; run.py hands its auth.json to Harbor, which copies it into each trial.
      - ${CODEX_HOME:-~/.codex}:/root/.codex-host:ro
  telemetry:
    # What the agent did: `docker compose exec telemetry trace` lists the latest traces, a question each, asked in a
    # session with the agent or by the eval, and with a trace's id prints it as a timeline (eval/linkedin_eval/trace.py). Antigravity CLI exports no telemetry, so the
    # trace is read from what a run leaves: the trials in the jobs volume, the CLI's transcripts in its home.
    # The eval's image, with nothing of its own but the two volumes, read-only. Its own process sends every new
    # trace to the collector, on the browser's network, and so to Cloud Trace, when .env names a project and
    # COMPOSE_PROFILES=trace starts the collector (eval/linkedin_eval/ship.py); without one it only waits.
    build: ./eval
    image: ghcr.io/lowgular/linkedin-eval:0.2.0
    network_mode: "service:browser"
    depends_on:
      - browser
    command: ["ship"]
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - jobs:/var/lib/docker/volumes/linkedin-agent-jobs/_data:ro
      - agy-home:/agy:ro
configs:
  browser-autostart:
    # The desktop's start script: the image's own runs Chromium once, so a browser whose last window closed —
    # the agent closing its last tab — would stay gone; this one starts it again.
    file: ./browser-autostart.sh

volumes:
  browser-profile:
    name: linkedin-agent-browser-${BROWSER_PROFILE:-default}
  agy-home:
  gemini-home:
  jobs:
    name: linkedin-agent-jobs
  harbor-cache:
