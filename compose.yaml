# compose.yaml — the agent and its world, for any machine with Docker: nothing installed on the host.
#
#   cp .env.example .env            then put your Gemini API key in it (Gemma 4 on the free tier costs nothing)
#   docker compose run --rm agent   Gemini CLI in this folder, the world started first; ask it about your profile
#   docker compose up -d world      the world alone, for a CLI installed on this machine (http://127.0.0.1:9333/mcp)
#   docker compose down             stop everything
#
# The agent container shares the world's network, so inside it the MCP is at 127.0.0.1:9333, exactly as the
# folder's .gemini/settings.json says, and the same address a CLI on the host uses through the mapped port.
# Sessions and the CLI's own state persist in the gemini-home volume; the folder itself is yours, bind-mounted,
# so what you change in the brief or the wiki is what the next run reads.
services:
  world:
    image: ghcr.io/lowgular/linkedin-world:0.3.2
    ports:
      - "127.0.0.1:9333:9333"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9333/health"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 5s
  agent:
    build: .
    image: ghcr.io/lowgular/linkedin-agent:0.1.0
    network_mode: "service:world"
    depends_on:
      world:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Tracing to Google Cloud, on when .env names a project (and COMPOSE_PROFILES=trace starts the collector):
      # the CLI sends its telemetry over OTLP to the collector service, which ships every model request and
      # tool call as a span to Cloud Trace, the events to Cloud Logging, token counts to Cloud Monitoring.
      # Without a project in .env the CLI emits nothing.
      GEMINI_TELEMETRY_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TRACES_ENABLED: ${GOOGLE_CLOUD_PROJECT:+true}
      GEMINI_TELEMETRY_TARGET: gcp
      GEMINI_TELEMETRY_USE_COLLECTOR: "true"
      GEMINI_TELEMETRY_OTLP_ENDPOINT: http://127.0.0.1:4317
      GEMINI_TELEMETRY_OTLP_PROTOCOL: grpc
      GEMINI_TELEMETRY_LOG_PROMPTS: ${GEMINI_TELEMETRY_LOG_PROMPTS:-true}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - .:/app
      - gemini-home:/root/.gemini
    working_dir: /app
    stdin_open: true
    tty: true
  collector:
    # Only with the `trace` profile (COMPOSE_PROFILES=trace in .env): ships the agent's telemetry to the
    # project GOOGLE_CLOUD_PROJECT names, with the Application Default Credentials from gcloud's folder on
    # this machine (`gcloud auth application-default login`), mounted read-only.
    image: otel/opentelemetry-collector-contrib:0.140.0
    profiles: ["trace"]
    network_mode: "service:world"
    depends_on:
      - world
    command: ["--config=/etc/otelcol/collector.yaml"]
    user: "0:0"
    environment:
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
    volumes:
      - ./telemetry/collector.yaml:/etc/otelcol/collector.yaml:ro
      - ${GCLOUD_CONFIG_DIR:-$HOME/.config/gcloud}:/gcloud:ro
volumes:
  gemini-home:
