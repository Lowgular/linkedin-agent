schema_version = "1.4"
artifacts = []

[task]
name = "lowgular/{{currentFolder}}"
version = "2.0.0"
description = ""
authors = []
keywords = []

[metadata]

[verifier]
timeout_sec = 120.0
collect = []

[verifier.env]

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[environment.env]
# The grader's extractor, from the host. EXTRACTOR=claude|gemini chooses (unset: Claude with a Claude login,
# Gemini with only a Gemini key); EXTRACTOR_MODEL overrides its model. Claude Haiku logs in with a console key
# or the Claude Code subscription token, Gemini with a Gemini API key.
EXTRACTOR = "${EXTRACTOR:-}"
EXTRACTOR_MODEL = "${EXTRACTOR_MODEL:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"

[solution.env]

# The environment is a browser and nothing more: its CDP on 9222. The browser tools are the agent's own
# (browser-mcp in the agent folder), started by the harness and attached over CDP, so no MCP server is
# declared here. The container is ready when the browser answers on CDP.
[environment.healthcheck]
command = "curl -sf http://127.0.0.1:9222/json/version"
interval_sec = 1.0
timeout_sec = 3.0
start_period_sec = 30.0
start_interval_sec = 1.0
retries = 5
