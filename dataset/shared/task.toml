schema_version = "1.4"
# The agent's trajectory is the one thing the grader reads: kept with the trial and handed to the grader at the
# same path, so the grader runs in a container of its own and a recorded job can be regraded when it changes.
artifacts = ["/logs/agent/trajectory.json"]

[task]
name = "lowgular/{{currentFolder}}"
version = "2.0.0"
description = ""
authors = []
keywords = []

[metadata]

[verifier]
timeout_sec = 120.0
collect = []
environment_mode = "separate"

[verifier.env]
# The grader's extractor, from the host. EXTRACTOR=claude|gemini chooses (unset: Claude with a Claude login,
# Gemini with only a Gemini key); EXTRACTOR_MODEL overrides its model. Claude Opus logs in with a console key
# or the Claude Code subscription token, Gemini with a Gemini API key. The grader's alone: the agent never sees them.
EXTRACTOR = "${EXTRACTOR:-}"
EXTRACTOR_MODEL = "${EXTRACTOR_MODEL:-}"
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[environment.env]

[solution.env]

# The environment is a browser and nothing more: its CDP on 9222. The browser tools are the agent's own
# (browser-mcp, from mcp/browser-mcp), a service of their own in this repository's eval (eval/compose.yaml) and attached over CDP, so no MCP server is
# declared here. The container is ready when the browser answers on CDP.
[environment.healthcheck]
command = "curl -sf http://127.0.0.1:9222/json/version"
interval_sec = 1.0
timeout_sec = 3.0
start_period_sec = 30.0
start_interval_sec = 1.0
retries = 5
