# The world image: the fake's runtime (browser-use-faker's image, `runtime`) with world/ at /opt/world,
# built by image.sh, tagged with `version` and never moved. Bump the version when world/ changes; the
# dataset (datasets/linkedin-po in github.com/Lowgular/marek) names the tag in its Dockerfile.
[world]
image = "ghcr.io/lowgular/linkedin-world"
version = "0.3.1"
runtime = "ghcr.io/lowgular/browser-use-faker:0.2.1"
